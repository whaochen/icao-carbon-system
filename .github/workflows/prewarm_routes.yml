name: Auto Pre-warm ICAO Routes & Screenshots

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prewarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & Playwright Chromium
        run: |
          pip install -r requirements.txt
          pip install playwright pandas requests pillow
          playwright install chromium
          playwright install-deps chromium

      - name: Run Pre-warm Worker
        run: python prewarm_worker.py

      - name: Commit and Push updated cache and screenshots
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add cache_db.csv screenshots/
          git diff --staged --quiet || git commit -m "Auto-update real ICAO data and official screenshots"
          git push
