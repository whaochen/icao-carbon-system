name: Auto Pre-warm ICAO Routes & Screenshots

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小時執行一次 (台灣時間 02:00, 08:00, 14:00, 20:00)
  workflow_dispatch: # 允許手動點擊 Run workflow 觸發

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pre-warm worker
        run: python prewarm_worker.py

      - name: Commit and push changes if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add screenshots/ cache_db.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update ICAO cache data and screenshots" && git push)
