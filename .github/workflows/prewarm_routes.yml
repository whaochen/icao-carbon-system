name: Auto Pre-warm ICAO Routes & Screenshots

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小時自動醒來巡邏一次
  workflow_dispatch:      # 支援在 GitHub 網頁上手動點按鈕立即執行！

permissions:
  contents: write         # 允許機器人將抓到的截圖與 CSV 直接存回 GitHub 倉庫

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright Chromium
        run: |
          pip install pandas playwright
          playwright install --with-deps chromium

      - name: Run Pre-warm Worker
        run: python prewarm_worker.py

      - name: Commit and Push Screenshots & Cache DB back to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache_db.csv screenshots/
          git diff --staged --quiet || git commit -m "Auto-update ICAO cache data and screenshots"
          git push
